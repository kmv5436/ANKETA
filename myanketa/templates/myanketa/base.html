<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Анкета о детях сотрудника{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 960px;
            margin: 0 auto;
            padding: 20px 15px 60px;
            color: #222;
            background: #fafafa;
            line-height: 1.5;
        }

        /* Навигация */
        nav.main-nav {
            background: #fff;
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        nav.main-nav a {
            color: #1976d2;
            text-decoration: none;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 4px;
        }
        nav.main-nav a:hover {
            background: #e3f2fd;
            text-decoration: none;
        }

        h1 { font-size: 24px; margin: 0 0 10px; color: #111; }
        h2 { font-size: 18px; margin: 30px 0 12px; border-bottom: 2px solid #333; padding-bottom: 5px; }
        h3 { font-size: 15px; margin: 0 0 10px; }

        p.hint { font-size: 13px; color: #666; margin: 4px 0 15px; }

        /* Таблицы */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            background: #fff;
        }
        table th, table td {
            border: 1px solid #ccc;
            padding: 7px 9px;
            text-align: left;
            vertical-align: top;
        }
        table th {
            background: #f4f4f4;
            font-weight: 600;
            font-size: 14px;
        }
        table td { font-size: 14px; }

        /* Поля ввода */
        input[type=text],
        input[type=date],
        input[type=email],
        input[type=number],
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 7px 9px;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            background: #fff;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #1976d2;
            box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.15);
        }
        textarea { resize: vertical; }

        input[type=checkbox] {
            width: auto;
            transform: scale(1.15);
            margin-right: 6px;
            vertical-align: middle;
        }

        /* Кнопки */
        .btn {
            display: inline-block;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            text-decoration: none;
            line-height: 1.3;
        }
        .btn-primary { background: #1976d2; color: #fff; }
        .btn-primary:hover { background: #1565c0; }
        .btn-secondary { background: #e0e0e0; color: #222; }
        .btn-secondary:hover { background: #d5d5d5; }
        .btn-danger { background: #d32f2f; color: #fff; }
        .btn-danger:hover { background: #b71c1c; }

        .actions {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* Сообщения */
        ul.messages {
            list-style: none;
            padding: 0;
            margin: 0 0 20px;
        }
        ul.messages li {
            padding: 11px 14px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 14px;
        }
        ul.messages li.success { background: #e8f5e9; border-left: 4px solid #2e7d32; }
        ul.messages li.warning { background: #fff3e0; border-left: 4px solid #ef6c00; }
        ul.messages li.error   { background: #ffebee; border-left: 4px solid #c62828; }
        ul.messages li.info    { background: #e3f2fd; border-left: 4px solid #1976d2; }

        /* Блок ребёнка */
        .child-block {
            border: 1px dashed #888;
            padding: 14px;
            margin-bottom: 18px;
            background: #fafafa;
            border-radius: 6px;
        }
        .child-block h3 {
            margin-top: 0;
            font-size: 15px;
            color: #1976d2;
        }

        /* Ошибки полей */
        .errorlist {
            color: #c62828;
            font-size: 13px;
            margin: 5px 0 0;
            padding-left: 18px;
        }

        /* Служебная информация под полем */
        .help-text {
            font-size: 12px;
            color: #777;
            margin-top: 3px;
        }

        /* Карточка / панель */
        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 18px;
            margin-bottom: 20px;
        }

        /* Адаптив */
        @media (max-width: 600px) {
            body { padding: 12px 8px 40px; }
            table th, table td { padding: 6px; font-size: 13px; }
            .actions { flex-direction: column; align-items: stretch; }
            .btn { text-align: center; }
        }

        /* Печать */
        @media print {
            nav.main-nav, .actions, .btn { display: none !important; }
            body { background: #fff; max-width: 100%; }
            .child-block { border: 1px solid #999; page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <nav class="main-nav">
        <a href="{% url 'employee_list' %}">📋 Анкеты</a>
        <a href="{% url 'employee_create' %}">➕ Новая анкета</a>
        <a href="{% url 'export_excel' %}">📥 Excel</a>
        <a href="{% url 'statistics' %}">📊 Статистика</a>
    </nav>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    {% block content %}{% endblock %}

</body>
</html>
